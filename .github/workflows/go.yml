name: Build arm64container

#on: [push, pull_request, workflow_dispatch]
on: [workflow_dispatch]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pcap
      run: |
        sudo apt update
        sudo apt install libpcap-dev

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v ipxbox.go

    - name: Test
      run: |
        go test network/pipe/*.go
        go test network/filter/*.go
        go test ipx/*.go

  crosscompile:
    strategy:
      matrix:
        goarch: [arm64]
#        goarch: [386, amd64, arm64]
        goos: [linux]
#        goos: [darwin, freebsd, linux, windows]
#        exclude:
#        - goarch: 386
#          goos: darwin

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: |
        mkdir output
        cd output
        go build -tags nopcap -v ../ipxbox.go
        go build -tags nopcap -v ../standalone/ipxbox_uplink.go
        go build -tags nopcap -v ../standalone/standalone_ipxpkt.go
        go build -tags nopcap -v ../standalone/standalone_pptp.go
        go build -tags nopcap -v ../standalone/standalone_qproxy.go
        pwd
        ls ./
        cd ..
        pwd
      env:
        GOARCH: ${{ matrix.goarch }}
        GOOS: ${{ matrix.goos }}

    # Github packages artifacts in .zip files which don't preserve
    # permissions, so we must make an inner tar. Sigh.
    #- name: Tar artifacts
    #  run: |
    #    mv artifacts artifacts2
    #    mkdir artifacts
    #    tar -C artifacts2 -czf artifacts/contents.tar.gz .
    #    pwd
    #    ls ./
    #  if: ${{ matrix.goos != 'windows' }}

    #- name: Upload build
    #  uses: actions/upload-artifact@v4
    #  with:
    #    path: "artifacts"
    #    name: ipxbox_${{ matrix.goos }}_${{ matrix.goarch }}

    #- name: Checkout repository
      #uses: actions/checkout@v4

    - name: Log in to GitHub container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      run: |
        pwd
     #   #ipxbox is in the artifacts2 folder
     #   ls output
     #   echo ""
     #   ls
        docker buildx build --platform linux/arm64 -t ghcr.io/kurikai/ipxbox/ipxbox:latest /home/runner/work/ipxbox/ipxbox

    - name: Build and push container
      run: |
        docker push ghcr.io/kurikai/ipxbox/ipxbox:latest
        #platforms: linux/arm64

